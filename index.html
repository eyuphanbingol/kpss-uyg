    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect } = React;

        const DERS_THEME = {
    "Tarih": { grad: "from-violet-500 to-fuchsia-900", text: "text-violet-700", soft: "bg-violet-50", icon: "🏛️", darkText: "text-violet-400", darkSoft: "bg-violet-950" },
    "Coğrafya": { grad: "from-emerald-400 to-cyan-900", text: "text-emerald-700", soft: "bg-emerald-50", icon: "🗺️", darkText: "text-emerald-400", darkSoft: "bg-emerald-950" },
    "Türkçe": { grad: "from-rose-400 to-pink-900", text: "text-rose-700", soft: "bg-rose-50", icon: "✍️", darkText: "text-rose-400", darkSoft: "bg-rose-950" },
    "Vatandaşlık": { grad: "from-sky-400 to-blue-900", text: "text-sky-700", soft: "bg-sky-50", icon: "⚖️", darkText: "text-sky-400", darkSoft: "bg-sky-950" },
    "Güncel Bilgiler": { grad: "from-amber-400 to-orange-900", text: "text-amber-700", soft: "bg-amber-50", icon: "📰", darkText: "text-amber-400", darkSoft: "bg-amber-950" },

};
        
        function themeFor(ders, isDark) {
            const t = DERS_THEME[ders] || { grad: "from-slate-500 to-slate-700", text: "text-slate-700", soft: "bg-slate-50", icon: "📚", darkText: "text-slate-400", darkSoft: "bg-slate-950" };
            return isDark ? { ...t, text: t.darkText, soft: t.darkSoft } : t;
        }

        function Shell(props) {
            const wide = props.wide;
            return (
                <div className={"mx-auto px-4 py-6 sm:py-10 " + (wide ? "max-w-3xl" : "max-w-2xl")}>
                    {props.children}
                </div>
            );
        }

        function Confetti() {
            const [pieces, setPieces] = useState([]);
            useEffect(() => {
                const colors = ['#6366f1', '#8b5cf6', '#d946ef', '#f59e0b', '#10b981', '#3b82f6', '#ef4444'];
                const newPieces = Array.from({length: 50}, (_, i) => ({
                    id: i,
                    left: Math.random() * 100 + '%',
                    delay: Math.random() * 2 + 's',
                    duration: (Math.random() * 2 + 2) + 's',
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: (Math.random() * 8 + 6) + 'px'
                }));
                setPieces(newPieces);
            }, []);
            return (
                <div className="fixed inset-0 pointer-events-none z-50 overflow-hidden">
                    {pieces.map(p => (
                        <div key={p.id} className="confetti" style={{
                            left: p.left,
                            animationDelay: p.delay,
                            animationDuration: p.duration,
                            width: p.size,
                            height: p.size,
                            backgroundColor: p.color,
                            borderRadius: Math.random() > 0.5 ? '50%' : '2px'
                        }} />
                    ))}
                </div>
            );
        }

        function App() {
            const [isDark, setIsDark] = useState(false);
            const kpssData = (typeof window !== "undefined" && window.kpssData) ? window.kpssData : {};

            const [selectedDers, setSelectedDers] = useState(null);
            const [selectedKonu, setSelectedKonu] = useState(null);
            const [viewMode, setViewMode] = useState("secim");
            
            // Yeni Eklenen: Not Slider State'i
            const [currentNoteIndex, setCurrentNoteIndex] = useState(0);

            const [qIndex, setQIndex] = useState(0);
            const [picked, setPicked] = useState(null);
            const [answered, setAnswered] = useState(false);
            const [score, setScore] = useState(0);
            const [wrongList, setWrongList] = useState([]);
            const [finished, setFinished] = useState(false);

            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDark]);

            function resetTestState() {
                setQIndex(0); setPicked(null); setAnswered(false);
                setScore(0); setWrongList([]); setFinished(false);
                setCurrentNoteIndex(0); // Test sıfırlanırken notlar da baştan başlasın
            }
            function goKonu(konu) { setSelectedKonu(konu); setViewMode("secim"); resetTestState(); }
            function backToSecim() { setViewMode("secim"); resetTestState(); }

            if (!kpssData || Object.keys(kpssData).length === 0) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen text-slate-500 gap-4">
                        <div className="h-12 w-12 rounded-full border-4 border-slate-300 border-t-indigo-500 animate-spin"></div>
                        <p className="font-medium text-lg">Veriler yüklenemedi. Sayfayı yenileyin.</p>
                    </div>
                );
            }

            function Crumb() {
                return (
                    <nav className="flex items-center gap-2 text-sm text-slate-500 flex-wrap mb-4 fade-in">
                        <button onClick={function () { setSelectedDers(null); setSelectedKonu(null); }} 
                            className="hover:text-indigo-600 transition font-medium flex items-center gap-1">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                            Ana Sayfa
                        </button>
                        {selectedDers ? (
                            <React.Fragment>
                                <svg className="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                                <button onClick={function () { setSelectedKonu(null); }} className="hover:text-indigo-600 transition font-medium">{selectedDers}</button>
                            </React.Fragment>
                        ) : null}
                        {selectedKonu ? (
                            <React.Fragment>
                                <svg className="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                                <span className="text-slate-700 dark:text-slate-200 font-semibold">{selectedKonu}</span>
                            </React.Fragment>
                        ) : null}
                    </nav>
                );
            }            

            // EKRAN 1: DERS SEÇİMİ
            if (!selectedDers) {
                return (
                    <Shell>
                        <div className="flex justify-end mb-6">
                            <button onClick={() => setIsDark(!isDark)} 
                                className="p-3 rounded-2xl bg-white dark:bg-slate-800 shadow-lg border border-slate-200 dark:border-slate-700 hover:scale-110 transition-all">
                                {isDark ? (
                                    <svg className="w-5 h-5 text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clipRule="evenodd" /></svg>
                                ) : (
                                    <svg className="w-5 h-5 text-slate-600" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" /></svg>
                                )}
                            </button>
                        </div>
                     <header className="flex flex-col items-center text-center mb-16 animate-fade-in-up">
    {/* Üst Rozet (Badge) - Modern bir detay */}
    <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 text-sm font-semibold mb-6 ring-1 ring-inset ring-indigo-500/20 backdrop-blur-sm transition-all hover:ring-indigo-500/40">
        <span className="relative flex h-2 w-2">
            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
            <span className="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
        </span>
        2026 Müfredatına Uygun
    </div>

    {/* Alternatif İkon - Daha soft ve premium görünüm */}
    <div className="relative group mb-6">
        <div className="absolute -inset-1 rounded-3xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 opacity-30 group-hover:opacity-50 blur transition duration-500"></div>
        <div className="relative inline-flex items-center justify-center h-20 w-20 rounded-3xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 text-4xl shadow-xl transition duration-500 group-hover:scale-105">
            🏆
        </div>
    </div>

    {/* Ana Başlık - Yerleşik Tailwind metin gradyanı ve text-balance */}
    <h1 className="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-4 max-w-3xl text-balance">
        KPSS{' '}
        <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500">
            Konu ve Soru Bankası
        </span>
    </h1>

    {/* Alt Metin - Daha iyi satır yüksekliği ve kontrast */}
    <p className="text-slate-600 dark:text-slate-400 text-lg sm:text-xl max-w-2xl mx-auto leading-relaxed text-balance">
        Çalışmak istediğiniz dersi seçerek başlayın. Kapsamlı notlar ve yeni nesil testler ile hedefinize emin adımlarla ilerleyin.
    </p>
</header>
                        <div className="grid sm:grid-cols-2 gap-5 fade-in">
                            {Object.keys(kpssData).map(function (ders, idx) {
                                const t = themeFor(ders, isDark);
                                const konuSayisi = Object.keys(kpssData[ders] || {}).length;
                                const soruSayisi = Object.keys(kpssData[ders] || {}).reduce(function (a, k) {
                                    return a + (((kpssData[ders][k] || {}).sorular || []).length);
                                }, 0);
                                return (
                                    <button key={ders} onClick={function () { setSelectedDers(ders); }}
                                        className={"group relative overflow-hidden text-left p-7 rounded-3xl text-white bg-gradient-to-br " + t.grad + " shadow-2xl ring-1 ring-white/20 transition-all card-hover"}>
                                        <div className="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                                        <div className="relative z-10">
                                            <div className="text-5xl mb-5 drop-shadow-lg">{t.icon}</div>
                                            <h2 className="text-2xl font-bold mb-1">{ders}</h2>
                                            <p className="text-white/80 text-sm font-medium">{konuSayisi} konu · {soruSayisi} soru</p>
                                        </div>
                                        <span className="absolute -right-8 -bottom-8 text-9xl opacity-10 group-hover:opacity-20 group-hover:scale-110 transition-all duration-700">{t.icon}</span>
                                        <div className="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 group-hover:translate-x-0 translate-x-4">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </Shell>
                );
            }

            // EKRAN 2: KONU SEÇİMİ
            if (selectedDers && !selectedKonu) {
                const t = themeFor(selectedDers, isDark);
                return (
                    <Shell>
                        <div className="flex justify-end mb-4">
                            <button onClick={() => setIsDark(!isDark)}

            // EKRAN 6: TEST
            const soru = sorular[qIndex] || { question: "", options: [], correctAnswerIndex: 0, explanation: "" };
            const progress = ((qIndex + 1) / (sorular.length || 1)) * 100;

            function handleAnswer(i) {
                if (answered) return;

                if (i === soru.correctAnswerIndex) {
                    setScore(function (s) { return s + 1; });

                    setWrongList(function (w) { return w.concat([{ question: soru.question, dogru: soru.options[soru.correctAnswerIndex] }]); });

            }
            function next() {
                if (qIndex + 1 < sorular.length) { setQIndex(qIndex + 1); setPicked(null); setAnswered(false); }

                            className="p-2.5 rounded-xl bg-white dark:bg-slate-800 shadow-md border border-slate-200 dark:border-slate-700 hover:scale-110 transition-all">
                            {isDark ? (
                                <svg className="w-5 h-5 text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clipRule="evenodd" /></svg>
                            ) : (
                                <svg className="w-5 h-5 text-slate-600" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" /></svg>
                            )}
                        </button>
                    </div>
                    <div className="flex justify-between items-center text-sm font-bold text-slate-500 dark:text-slate-400 mb-4 fade-in">
                        <button onClick={function () { if (confirm("Testten çıkmak istediğinize emin misiniz?")) backToSecim(); }} 
                            className="hover:text-rose-500 transition flex items-center gap-1 bg-white dark:bg-slate-800 px-3 py-2 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                            Bitir
                        </button>
                        <span className="bg-white dark:bg-slate-800 px-4 py-2 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                            Soru <b className="text-indigo-600 dark:text-indigo-400">{qIndex + 1}</b> / {sorular.length} · Doğru: <b className="text-emerald-600 dark:text-emerald-400">{score}</b>
                        </span>
                    </div>

                    <div className="w-full bg-slate-200 dark:bg-slate-700 h-2.5 rounded-full mb-6 overflow-hidden shadow-inner">
                        <div className="bg-gradient-to-r from-indigo-500 to-purple-500 h-2.5 rounded-full transition-all duration-500 ease-out shadow-lg" style={{ width: progress + "%" }}></div>
                    </div>

                    <div className="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-lg mb-6 fade-in relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-indigo-500 to-purple-500"></div>
                        <h3 className="text-lg sm:text-xl font-bold text-slate-800 dark:text-slate-100 leading-relaxed whitespace-pre-line">{soru.question}</h3>
                    </div>

                    <div className="space-y-3 fade-in">
                        {(soru.options || []).map(function (opt, i) {
                            let cls = "w-full text-left p-5 rounded-2xl border-2 font-semibold transition-all flex items-center gap-4 option-btn ";
                            let icon = null;
                            if (answered) {
                                if (i === soru.correctAnswerIndex) {
                                    cls += "bg-emerald-500 border-emerald-500 text-white shadow-lg shadow-emerald-200 dark:shadow-emerald-900/30";
                                    icon = <svg className="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>;
                                }
                                else if (i === picked) {
                                    cls += "bg-rose-500 border-rose-500 text-white shadow-lg shadow-rose-200 dark:shadow-rose-900/30";
                                    icon = <svg className="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M6 18L18 6M6 6l12 12" /></svg>;
                                }
                                else cls += "bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700 text-slate-400 dark:text-slate-500 opacity-60";
                            } else {
                                cls += "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 hover:border-indigo-400 dark:hover:border-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 hover:shadow-md active:scale-[0.99]";
                                icon = <span className="flex-shrink-0 h-8 w-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-500 dark:text-slate-400">{String.fromCharCode(65 + i)}</span>;
                            }
                            return (
                                <button key={i} onClick={function () { handleAnswer(i); }} disabled={answered} className={cls}>
                                    {icon}
                                    <span className="text-[15px]">{opt}</span>
                                </button>
                            );
                        })}
                    </div>

                    {answered ? (
                        <div className="mt-8 space-y-4 fade-in">
                            <div className="bg-gradient-to-r from-blue-50 to-indigo-50 dark:from-blue-950/30 dark:to-indigo-950/30 border border-blue-200 dark:border-blue-800/50 border-l-4 border-l-blue-500 p-6 rounded-2xl shadow-sm">
                                <h4 className="font-bold text-blue-800 dark:text-blue-300 text-sm mb-2 flex items-center gap-2">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>
                                    Çözüm Notu
                                </h4>
                                <p className="text-slate-700 dark:text-slate-300 text-sm leading-relaxed">{soru.explanation}</p>
                            </div>
                            <button onClick={next} 
                                className="w-full bg-gradient-to-r from-slate-800 to-slate-900 dark:from-indigo-600 dark:to-purple-600 hover:from-slate-900 hover:to-black dark:hover:from-indigo-700 dark:hover:to-purple-700 text-white p-5 rounded-2xl font-bold shadow-xl transition-all hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2 text-lg">
                                {qIndex + 1 === sorular.length ? (
                                    <React.Fragment>
                                        Sonuçları Gör
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                                    </React.Fragment>
                                ) : (
                                    <React.Fragment>
                                        Sonraki Soru
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg>
                                    </React.Fragment>
                                )}
                            </button>
                        </div>
                    ) : null}
                </Shell>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>

</html>
