    <style>
        /* ===== GENEL ===== */
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
        }

        /* ===== KARMAŞIK ARKA PLAN ===== */
        .app-bg {
            background: radial-gradient(ellipse at 10% 20%, rgba(29, 138, 153, 0.10) 0%, transparent 50%),
                        radial-gradient(ellipse at 90% 80%, rgba(197, 160, 89, 0.08) 0%, transparent 50%),
                        #f8fafc;
        }
        .dark .app-bg {
            background: radial-gradient(ellipse at 10% 20%, rgba(29, 138, 153, 0.16) 0%, transparent 50%),
                        radial-gradient(ellipse at 90% 80%, rgba(13, 44, 77, 0.35) 0%, transparent 50%),
                        #0f172a;
        }

        /* ===== CAM KART (GLASSMORPHISM) ===== */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* ===== KART HOVER ===== */
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(226, 232, 240, 0.6);
        }
        .card-hover:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
        }
        .dark .card-hover:hover {
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
            border-color: rgba(99, 102, 241, 0.2);
        }

        /* ===== BUTON GRADIENT ===== */
        .btn-primary {
            background: linear-gradient(135deg, #0D2C4D, #1D8A99);
            border: none;
            color: #fff;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(29, 138, 153, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(13, 44, 77, 0.4);
        }
        .btn-primary:active { transform: scale(0.97); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.8);
            color: #1e293b;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .dark .btn-secondary {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(71, 85, 105, 0.5);
            color: #e2e8f0;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.95);
            border-color: #94a3b8;
            transform: translateY(-2px);
        }
        .dark .btn-secondary:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: #64748b;
        }

        /* ===== GRADIENT METIN ===== */
        .gradient-text {
            background: linear-gradient(135deg, #0D2C4D, #1D8A99, #C5A059);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== NAVBAR GLASS ===== */
        .nav-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.05);
        }
        .dark .nav-glass {
            background: rgba(15, 23, 42, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.3);
        }

        /* ===== STREAK BADGE ===== */
        .streak-badge {
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 9999px;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }

        /* ===== PROGRESS RING ===== */
        .progress-ring {
            transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* ===== ANIMASYONLAR ===== */
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-up {
            animation: slideUp 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .pulse-glow {
            animation: pulseGlow 2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.3); }
            50% { box-shadow: 0 0 0 12px rgba(79, 70, 229, 0); }
        }

        .duyuru-bar {
            background: linear-gradient(90deg, #0D2C4D, #1D8A99, #C5A059, #1D8A99, #0D2C4D);
            background-size: 200% 100%;
            animation: duyuruSweep 1.4s linear infinite;
        }
        @keyframes duyuruSweep {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .duyuru-badge {
            animation: duyuruBlink 0.8s ease-in-out infinite;
        }
        @keyframes duyuruBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.96); }
        }

        /* ===== DERS IKONLARI ===== */
        .ders-icon {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.08), rgba(124, 58, 237, 0.08));
            border: 1px solid rgba(79, 70, 229, 0.1);
            transition: all 0.3s ease;
        }
        .ders-icon:hover {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.15), rgba(124, 58, 237, 0.15));
            transform: scale(1.05);
        }

        /* ===== YUVARLAK KARTLAR ===== */
        .rounded-3xl { border-radius: 1.5rem; }
        .rounded-2xl { border-radius: 1.25rem; }
        .rounded-xl { border-radius: 1rem; }

        /* ===== INPUT ===== */
        input, select, textarea {
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            outline: none;
        }
        .dark input, .dark select, .dark textarea {
            background: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }
        .dark input:focus, .dark select:focus, .dark textarea:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        body { font-family: Inter, sans-serif; }
        h1, h2, .font-display { font-family: Manrope, Inter, sans-serif; }
        .font-stat { font-family: "Space Grotesk", Inter, sans-serif; }

        .option-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .option-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        .option-btn:hover::before {
            transform: translateX(100%);
        }

        .progress-ring {
            transition: stroke-dashoffset 0.5s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-step { animation: slideStep 0.2s ease-out; }
        @keyframes slideStep {
            from { opacity: 0; transform: translateX(12px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .pop-in { animation: popIn 0.32s cubic-bezier(0.2, 0.9, 0.2, 1); }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .confetti {
            position: fixed;
            width: 8px; height: 8px;
            animation: confetti-fall 1.6s ease-out forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-20vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(80vh) rotate(280deg); opacity: 0; }
        }

        html { background: #FAFAF9; }
        body.app-bg { background: #FAFAF9; color: #211F1D; }
        html.dark, .dark body.app-bg { background: #211F1D; color: #FAFAF9; }

        .panel {
            background: #fff;
            border: 1px solid #D3D0CB;
            box-shadow: 0 1px 2px rgba(33,31,29,0.04);
        }
        .dark .panel {
            background: #2A2724;
            border-color: #4A4642;
            box-shadow: none;
        }

        .badge-gold {
            background: #F5EBC7;
            color: #8A6F1A;
            font-weight: 600;
        }

        .exam-banner {
            position: sticky;
            top: 0;
            z-index: 30;
            background: #1E1B4B;
            color: #fff;
            font-size: 12px;
            text-align: center;
            padding: 8px 12px;
        }

        .booklet {
            background: #FAFAF9;
            border: 1px solid #D3D0CB;
        }
        .dark .booklet {
            background: #2A2724;
            border-color: #4A4642;
        }

        .heat-zayif { background: linear-gradient(90deg, rgba(225,29,72,0.12), transparent); }
        .heat-orta { background: linear-gradient(90deg, rgba(217,119,6,0.12), transparent); }
        .heat-iyi { background: linear-gradient(90deg, rgba(15,118,110,0.12), transparent); }

        input[type="range"] { accent-color: #1E1B4B; }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 2px solid #1E1B4B;
            outline-offset: 2px;
        }
        .dark button:focus-visible, .dark input:focus-visible, .dark select:focus-visible {
            outline-color: #5F599F;
        }

        .overlay-scrim {
            background: rgba(9, 9, 11, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .overlay-sheet {
            background: #fff;
            border-radius: 1.25rem;
            border: 1px solid #e4e4e7;
        }
        .dark .overlay-sheet {
            background: #0f172a;
            border-color: #1e293b;
        }
