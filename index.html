    <style>
        /* ===== GENEL ===== */
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #041C24;
            color: #0f172a;
            min-height: 100vh;
        }

        /* ===== KARMAŞIK ARKA PLAN ===== */
        .app-bg {
            background: linear-gradient(135deg, #041C24 0%, #0A3842 48%, #127880 100%);
        }
        .dark .app-bg {
            background: linear-gradient(135deg, #03151b 0%, #082f38 50%, #0d5c66 100%);
        }

        .brand-backdrop {
            background: linear-gradient(135deg, #041C24 0%, #0A3842 48%, #127880 100%);
        }
        .brand-glow {
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 140px;
            background: rgba(197, 160, 89, 0.12);
            top: 28%;
            left: 50%;
            margin-left: -140px;
            pointer-events: none;
        }
        .brand-ring {
            position: absolute;
            border-radius: 9999px;
            pointer-events: none;
            left: 50%;
        }
        .brand-ring-outer {
            width: 340px;
            height: 340px;
            margin-left: -170px;
            top: 24%;
            border: 1px solid rgba(197, 160, 89, 0.28);
        }
        .brand-ring-inner {
            width: 220px;
            height: 220px;
            margin-left: -110px;
            top: 32%;
            border: 1px solid rgba(29, 138, 153, 0.45);
        }
        .app-shell {
            background: #FAFAF9;
            color: #211F1D;
            min-height: 100vh;
        }
        html.dark .app-shell {
            background: #211F1D;
            color: #FAFAF9;
        }

        /* ===== CAM KART (GLASSMORPHISM) ===== */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* ===== KART HOVER ===== */
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(226, 232, 240, 0.6);
        }
        .card-hover:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
        }
        .dark .card-hover:hover {
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
            border-color: rgba(99, 102, 241, 0.2);
        }

        /* ===== BUTON GRADIENT ===== */
        .btn-primary {
            background: linear-gradient(135deg, #0D2C4D 0%, #14607a 42%, #1D8A99 100%);
            background-size: 140% 140%;
            border: none;
            color: #fff !important;
            font-weight: 700;
            letter-spacing: 0.01em;
            transition: transform 0.22s ease, box-shadow 0.22s ease, background-position 0.45s ease, filter 0.22s ease;
            box-shadow: 0 8px 22px rgba(13, 44, 77, 0.28), inset 0 1px 0 rgba(255,255,255,0.22);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            background-position: 100% 0;
            box-shadow: 0 12px 28px rgba(13, 44, 77, 0.38), inset 0 1px 0 rgba(255,255,255,0.28);
            filter: brightness(1.04);
        }
        .btn-primary:active { transform: scale(0.98) translateY(0); }
        .btn-primary:disabled {
            opacity: 0.42;
            transform: none;
            filter: none;
            box-shadow: none;
            cursor: not-allowed;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px 8px 10px;
            border-radius: 9999px;
            border: 1px solid rgba(13, 44, 77, 0.12);
            background: #fff;
            color: #0D2C4D;
            font-size: 13px;
            font-weight: 650;
            letter-spacing: 0.01em;
            box-shadow: 0 1px 2px rgba(13, 44, 77, 0.06);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
        }
        .back-btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .back-btn:hover {
            transform: translateX(-3px);
            border-color: #1D8A99;
            background: #f3fbfc;
            box-shadow: 0 6px 16px rgba(29, 138, 153, 0.16);
        }
        .back-btn:active { transform: translateX(-1px) scale(0.98); }
        html.dark .back-btn {
            background: #2A2724;
            color: #F5EBC7;
            border-color: rgba(255,255,255,0.1);
        }
        html.dark .back-btn:hover {
            background: #332f2b;
            border-color: #1D8A99;
        }

        .btn-google {
            background: #fff;
            border: 1px solid #e7e5e4;
            color: #1c1917 !important;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(28, 25, 23, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .btn-google:hover {
            transform: translateY(-1px);
            border-color: #1D8A99;
            box-shadow: 0 8px 18px rgba(29, 138, 153, 0.14);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.8);
            color: #1e293b;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .dark .btn-secondary {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(71, 85, 105, 0.5);
            color: #e2e8f0;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.95);
            border-color: #94a3b8;
            transform: translateY(-2px);
        }
        .dark .btn-secondary:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: #64748b;
        }

        /* ===== GRADIENT METIN ===== */
        .gradient-text {
            background: linear-gradient(135deg, #0D2C4D, #1D8A99, #C5A059);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== NAVBAR GLASS ===== */
        .nav-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.05);
        }
        .dark .nav-glass {
            background: rgba(15, 23, 42, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.3);
        }

        /* ===== STREAK BADGE ===== */
        .streak-badge {
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 9999px;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }

        /* ===== PROGRESS RING ===== */
        .progress-ring {
            transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* ===== ANIMASYONLAR ===== */
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-up {
            animation: slideUp 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .pulse-glow {
            animation: pulseGlow 2s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.3); }
            50% { box-shadow: 0 0 0 12px rgba(79, 70, 229, 0); }
        }

        .duyuru-bar {
            background: linear-gradient(90deg, #0D2C4D, #1D8A99, #C5A059, #1D8A99, #0D2C4D);
            background-size: 200% 100%;
            animation: duyuruSweep 1.4s linear infinite;
        }
        @keyframes duyuruSweep {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .duyuru-badge {
            animation: duyuruBlink 0.8s ease-in-out infinite;
        }
        @keyframes duyuruBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.96); }
        }

        /* ===== DERS IKONLARI ===== */
        .ders-icon {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.08), rgba(124, 58, 237, 0.08));
            border: 1px solid rgba(79, 70, 229, 0.1);
            transition: all 0.3s ease;
        }
        .ders-icon:hover {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.15), rgba(124, 58, 237, 0.15));
            transform: scale(1.05);
        }

        /* ===== YUVARLAK KARTLAR ===== */
        .rounded-3xl { border-radius: 1.5rem; }
        .rounded-2xl { border-radius: 1.25rem; }
        .rounded-xl { border-radius: 1rem; }

        /* ===== INPUT ===== */
        input, select, textarea {
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            outline: none;
        }
        .dark input, .dark select, .dark textarea {
            background: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }
        .dark input:focus, .dark select:focus, .dark textarea:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        body { font-family: Inter, sans-serif; }
        h1, h2, .font-display { font-family: Manrope, Inter, sans-serif; }
        .font-stat { font-family: "Space Grotesk", Inter, sans-serif; }

        .option-btn {
            transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.22s ease, border-color 0.22s ease, background 0.22s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        }
        .option-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(29,138,153,0.08), transparent);
            transform: translateX(-100%);
            transition: transform 0.55s ease;
            pointer-events: none;
        }
        .option-btn:hover:not(:disabled)::before {
            transform: translateX(100%);
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #1D8A99 !important;
            box-shadow: 0 12px 28px -14px rgba(29, 138, 153, 0.55);
        }
        .choice-letter {
            background: linear-gradient(135deg, #0D2C4D, #1D8A99) !important;
            color: #fff !important;
            box-shadow: 0 2px 8px rgba(13, 44, 77, 0.25);
        }
        .q-stem {
            background: #fff;
            border: 1px solid rgba(13, 44, 77, 0.08);
            box-shadow: 0 14px 40px -18px rgba(4, 28, 36, 0.35);
            color: #1c1917;
        }
        .q-stem-bar {
            background: linear-gradient(180deg, #1D8A99, #C5A059);
        }

        .study-card {
            border-radius: 1.5rem;
            overflow: hidden;
            background: #fff;
            border: 1px solid rgba(13, 44, 77, 0.1);
            box-shadow: 0 24px 60px -22px rgba(4, 28, 36, 0.48);
        }
        .study-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 22px;
            background: linear-gradient(135deg, #041C24 0%, #0A3842 48%, #127880 100%);
        }
        .study-card-kicker {
            margin: 0 0 4px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(245, 235, 199, 0.72);
        }
        .study-card-title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.3;
        }
        .note-progress {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 3.4rem;
            height: 2.15rem;
            padding: 0 0.8rem;
            border-radius: 9999px;
            background: rgba(245, 235, 199, 0.14);
            border: 1px solid rgba(245, 235, 199, 0.28);
            color: #F5EBC7;
            font-family: "Space Grotesk", Inter, sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }
        .study-card-body {
            padding: 22px 20px 12px;
            overflow-x: auto;
            color: #1c1917;
        }
        .study-card-body,
        .study-card-body * {
            box-sizing: border-box;
        }
        .study-card-body .grid {
            width: 100%;
        }
        .study-card-body .grid-cols-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .study-card-body .max-w-md,
        .study-card-body .max-w-lg,
        .study-card-body .max-w-xl,
        .study-card-body .max-w-2xl {
            max-width: 100% !important;
            width: 100%;
        }
