    <style>
        body { font-family: Inter, sans-serif; }
        h1, h2, .font-display { font-family: Manrope, Inter, sans-serif; }
        .font-stat { font-family: "Space Grotesk", Inter, sans-serif; }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card-hover {
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @media (hover: hover) and (pointer: fine) {
            .card-hover:hover {
                transform: translateY(-3px);
                box-shadow: 0 16px 32px -16px rgba(15, 23, 42, 0.28);
            }
        }

        .option-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .option-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }
        .option-btn:hover::before {
            transform: translateX(100%);
        }

        .progress-ring {
            transition: stroke-dashoffset 0.5s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-step { animation: slideStep 0.2s ease-out; }
        @keyframes slideStep {
            from { opacity: 0; transform: translateX(12px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .pop-in { animation: popIn 0.32s cubic-bezier(0.2, 0.9, 0.2, 1); }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .confetti {
            position: fixed;
            width: 8px; height: 8px;
            animation: confetti-fall 1.6s ease-out forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-20vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(80vh) rotate(280deg); opacity: 0; }
        }

        html { background: #FAFAF9; }
        body.app-bg { background: #FAFAF9; color: #211F1D; }
        html.dark, .dark body.app-bg { background: #211F1D; color: #FAFAF9; }

        .panel {
            background: #fff;
            border: 1px solid #D3D0CB;
            box-shadow: 0 1px 2px rgba(33,31,29,0.04);
        }
        .dark .panel {
            background: #2A2724;
            border-color: #4A4642;
            box-shadow: none;
        }

        .badge-gold {
            background: #F5EBC7;
            color: #8A6F1A;
            font-weight: 600;
        }

        .exam-banner {
            position: sticky;
            top: 0;
            z-index: 30;
            background: #1E1B4B;
            color: #fff;
            font-size: 12px;
            text-align: center;
            padding: 8px 12px;
        }

        .booklet {
            background: #FAFAF9;
            border: 1px solid #D3D0CB;
        }
        .dark .booklet {
            background: #2A2724;
            border-color: #4A4642;
        }

        .heat-zayif { background: linear-gradient(90deg, rgba(225,29,72,0.12), transparent); }
        .heat-orta { background: linear-gradient(90deg, rgba(217,119,6,0.12), transparent); }
        .heat-iyi { background: linear-gradient(90deg, rgba(15,118,110,0.12), transparent); }

        input[type="range"] { accent-color: #1E1B4B; }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 2px solid #1E1B4B;
            outline-offset: 2px;
        }
        .dark button:focus-visible, .dark input:focus-visible, .dark select:focus-visible {
            outline-color: #5F599F;
        }

        .overlay-scrim {
            background: rgba(9, 9, 11, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .overlay-sheet {
            background: #fff;
            border-radius: 1.25rem;
            border: 1px solid #e4e4e7;
        }
        .dark .overlay-sheet {
            background: #0f172a;
            border-color: #1e293b;
        }

            navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });

                keys.forEach(function (k) { caches.delete(k); });
