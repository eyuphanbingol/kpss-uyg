<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 422" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d5a4a"/>
      <stop offset="45%" stop-color="#7a8f55"/>
      <stop offset="78%" stop-color="#c9b07a"/>
      <stop offset="100%" stop-color="#5f7d58"/>
    </linearGradient>
    <radialGradient id="eastHigh" cx="78%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="westGreen" cx="22%" cy="44%" r="38%">
      <stop offset="0%" stop-color="#4e7a3a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4e7a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="southWarm" cx="48%" cy="78%" r="40%">
      <stop offset="0%" stop-color="#2f6a52" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2f6a52" stop-opacity="0"/>
    </radialGradient>
    <filter id="bump" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.026" numOctaves="4" seed="11" result="n"/>
      <feDiffuseLighting in="n" lighting-color="#fff6df" surfaceScale="7" result="lit">
        <feDistantLight azimuth="320" elevation="42"/>
      </feDiffuseLighting>
      <feComposite in="lit" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="1000" height="422" fill="url(#sky)"/>
  <rect width="1000" height="422" fill="url(#westGreen)"/>
  <rect width="1000" height="422" fill="url(#eastHigh)"/>
  <rect width="1000" height="422" fill="url(#southWarm)"/>
  <rect width="1000" height="422" filter="url(#bump)" opacity="0.55"/>
  <!-- rough highland ridges (decorative; pins use same viewBox) -->
  <g opacity="0.22" filter="url(#soft)" fill="#2a3d28">
    <ellipse cx="780" cy="195" rx="160" ry="48"/>
    <ellipse cx="690" cy="230" rx="90" ry="28"/>
    <ellipse cx="860" cy="165" rx="70" ry="22"/>
    <ellipse cx="520" cy="250" rx="120" ry="26"/>
    <ellipse cx="310" cy="210" rx="100" ry="24"/>
    <ellipse cx="180" cy="165" rx="70" ry="18"/>
  </g>
  <g opacity="0.18" fill="#f5e6c0">
    <ellipse cx="760" cy="175" rx="40" ry="12"/>
    <ellipse cx="820" cy="150" rx="28" ry="8"/>
  </g>
</svg>
