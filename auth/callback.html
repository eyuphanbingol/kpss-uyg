<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atanly</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 48px 24px; text-align: center; color: #334155; }
    </style>
</head>
<body>
    <p>Giriş tamamlanıyor…</p>
    <script>
        (function () {
            var q = location.search || "";
            var h = location.hash || "";
            try { location.replace("atanly://auth/callback" + q + h); } catch (e) {}
            setTimeout(function () {
                document.body.innerHTML = "<p>Giriş tamam. Atanly uygulamasına dönebilirsin.</p>";
            }, 900);
        })();
    </script>
</body>
</html>
