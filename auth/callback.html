<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atanly</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 48px 24px; text-align: center; color: #334155; }
    </style>
</head>
<body>
    <p>Giriş tamamlanıyor…</p>
    <script>
        // Kayıt onayı (…/auth/callback?token_hash=…&type=email), şifre sıfırlama ve uygulamadan
        // Google girişi dönüşleri buraya gelir. Telefonda önce uygulama denenir; uygulama açıldıysa
        // tarayıcı ayrıca doğrulama yapmaz (tek kullanımlık bağlantı iki kez harcanmasın).
        (function () {
            var q = location.search || "";
            var h = location.hash || "";
            var blob = q + h;
            var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            var recovery = /type=recovery/i.test(blob) || /[?&]reset=/.test(blob);
            var emailLink = /[?&#]token_hash=/.test(blob);
            var left = false;
            document.addEventListener("visibilitychange", function () { if (document.hidden) left = true; });
            function openApp(path, then) {
                try { location.href = "atanly://" + path + q + h; } catch (e) {}
                setTimeout(function () { if (left || document.hidden) return; then(); }, 1200);
            }
            if (recovery) {
                if (!/[?&]reset=/.test(q)) q = (q ? q + "&reset=1" : "?reset=1");
                var webReset = function () { location.replace("/" + q + h); };
                if (!mobile) webReset(); else openApp("reset", webReset);
                return;
            }
            if (emailLink) {
                // Site bağlantıyı doğrular ve oturumu açar (js/supabaseClient.js confirmFromUrl)
                var webConfirm = function () { location.replace("/" + q + h); };
                if (!mobile) webConfirm(); else openApp("auth/callback", webConfirm);
                return;
            }
            // Uygulamadan Google girişi. Bazı tarayıcılar sayfanın kendiliğinden uygulamayı açmasına izin
            // vermez; dokunulan bağlantı her zaman çalışır.
            var appUrl = "atanly://auth/callback" + q + h;
            var btn = document.createElement("a");
            btn.href = appUrl;
            btn.textContent = "Uygulamaya dön";
            btn.setAttribute("style", "display:inline-block;margin-top:16px;padding:14px 28px;border-radius:12px;background:#0E7490;color:#fff;font-weight:600;text-decoration:none");
            document.body.appendChild(btn);
            openApp("auth/callback", function () {
                document.querySelector("p").textContent = "Giriş tamam. Devam etmek için aşağıdaki düğmeye dokun.";
            });
        })();
    </script>
</body>
</html>
